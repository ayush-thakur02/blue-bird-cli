name: oidc-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: OIDC availability
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "GITHUB_WORKFLOW_REF: $GITHUB_WORKFLOW_REF"
          echo "node: $(node --version)"

      - name: Exchange an OIDC token for an npm publish token
        run: |
          cat > /tmp/check.mjs <<'SCRIPT'
          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const token = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          console.log("request url host:", new URL(url).host);
          const res = await fetch(`${url}&audience=npm:registry.npmjs.org`, {
            headers: { authorization: `bearer ${token}` },
          });
          console.log("id token status:", res.status);
          const body = await res.json();
          if (!body.value) {
            console.log("id token body:", JSON.stringify(body));
            process.exit(0);
          }
          const claims = JSON.parse(Buffer.from(body.value.split(".")[1], "base64url").toString("utf8"));
          for (const key of ["aud", "repository", "repository_visibility", "workflow", "job_workflow_ref", "ref", "event_name", "sub"]) {
            console.log(`${key}: ${claims[key]}`);
          }
          const exchange = await fetch(
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40not.ayushthakur%2Fblue-bird-cli",
            {
              method: "POST",
              headers: { authorization: `Bearer ${body.value}`, "content-type": "application/json" },
            },
          );
          console.log("exchange status:", exchange.status);
          const text = await exchange.text();
          try {
            const json = JSON.parse(text);
            console.log(json.token ? `exchange returned a token (length ${json.token.length})` : `exchange body: ${JSON.stringify(json)}`);
          } catch {
            console.log("exchange body (raw):", text);
          }
          SCRIPT
          node /tmp/check.mjs
