name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `--include=dev` because NODE_ENV=production would otherwise skip typescript.
      - run: npm ci --include=dev

      - run: npm run verify

      # The tarball ships dist/, so the build and the compiled entry point are part of CI.
      - run: npm run build
      - run: node dist/cli.js --version

      - name: Published tarball contents
        run: npm run pack:check
